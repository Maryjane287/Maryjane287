<title>Samesies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;800&display=swap">
<style>
:root {
  color-scheme: light;
  --ground: #F3F1FF;
  --card: #FFFFFF;
  --ink: #1D1646;
  --muted: #6A6390;
  --line: #1D1646;
  --pink: #FF4F8B;
  --aqua: #16BFB3;
  --sun: #FFD23F;
  --bar: #FFC2D7;
  --bar-top: #FF7EAA;
  --you: #16BFB3;
  --shadow: #1D1646;
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #120F2A; --card: #1E1940; --ink: #F3F0FF; --muted: #A9A2D6;
    --line: #F3F0FF; --pink: #FF6FA0; --aqua: #3EE0D2; --sun: #FFD84D;
    --bar: #4A2A55; --bar-top: #B8336A; --you: #3EE0D2; --shadow: #000000;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #120F2A; --card: #1E1940; --ink: #F3F0FF; --muted: #A9A2D6;
  --line: #F3F0FF; --pink: #FF6FA0; --aqua: #3EE0D2; --sun: #FFD84D;
  --bar: #4A2A55; --bar-top: #B8336A; --you: #3EE0D2; --shadow: #000000;
}

html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent; }
#app { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; box-sizing: border-box; min-height: 100%; display: flex; flex-direction: column; gap: 18px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--aqua); outline-offset: 3px; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; }
.brand svg { width: 38px; height: 26px; }
.brand b { font: 800 1.45rem/1 var(--display); letter-spacing: -.02em; }
.chips { display: flex; gap: 8px; }
.chip { font: 800 .85rem var(--body); padding: 5px 11px; border: 2px solid var(--line); border-radius: 999px; background: var(--card); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* type */
h1, h2 { font-family: var(--display); letter-spacing: -.025em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.3rem, 11vw, 3.4rem); line-height: .95; font-weight: 800; }
h2 { font-size: clamp(1.6rem, 7vw, 2.1rem); line-height: 1.05; font-weight: 800; }
.eyebrow { font: 800 .75rem var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--pink); margin: 0; }
.muted { color: var(--muted); margin: 0; }
.small { font-size: .85rem; }
p { margin: 0; }

/* cards & buttons */
.card { background: var(--card); border: 2.5px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 5px 5px 0 var(--shadow); display: flex; flex-direction: column; gap: 14px; }
.btn { border: 2.5px solid var(--line); border-radius: 999px; padding: 13px 22px; min-height: 52px; background: var(--pink); color: #fff; font: 800 1.1rem var(--display); box-shadow: 4px 4px 0 var(--shadow); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--shadow); }
.btn.alt { background: var(--card); color: var(--ink); }
.btn.aqua { background: var(--aqua); color: #10233A; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 auto; }
.link { border: 0; background: none; padding: 4px 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }

/* home */
.hero { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.venn { width: 150px; height: 96px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { text-align: center; }
.stat b { display: block; font: 800 1.5rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 800; }
.count { font: 800 1.2rem var(--display); font-variant-numeric: tabular-nums; }
.field { display: flex; gap: 8px; }
.field input { flex: 1; min-width: 0; border: 2.5px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--ground); font-weight: 600; }

/* question */
.progress { display: flex; gap: 6px; }
.progress i { flex: 1; height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 15%, transparent); }
.progress i.done { background: var(--pink); }
.progress i.now { background: var(--sun); }
.qtag { align-self: flex-start; font: 800 .75rem var(--body); letter-spacing: .1em; text-transform: uppercase; background: var(--sun); color: #1D1646; border: 2px solid var(--line); border-radius: 999px; padding: 3px 10px; }
.prompt { font: 800 clamp(1.7rem, 7.5vw, 2.3rem)/1.08 var(--display); letter-spacing: -.02em; text-wrap: balance; }
.answer { width: 100%; box-sizing: border-box; border: 2.5px solid var(--line); border-radius: 14px; padding: 16px; font: 800 1.35rem var(--display); background: var(--ground); }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.options.nums { grid-template-columns: repeat(5, 1fr); }
.opt { border: 2.5px solid var(--line); border-radius: 14px; background: var(--card); padding: 14px 10px; font: 800 1.1rem var(--display); box-shadow: 3px 3px 0 var(--shadow); }
.opt:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.slider { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.slider output { font: 800 3.2rem/1 var(--display); color: var(--pink); font-variant-numeric: tabular-nums; }
.slider input { width: 100%; accent-color: var(--pink); height: 32px; }
.hint { font-size: .85rem; color: var(--muted); }

/* reveal board */
.board { display: flex; flex-direction: column; gap: 7px; }
.bar { position: relative; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; overflow: hidden; background: var(--card); }
.bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--bar); transition: width .7s cubic-bezier(.2, .8, .2, 1); z-index: 0; }
.bar.top .fill { background: var(--bar-top); }
.bar > span { position: relative; z-index: 1; font-weight: 800; }
.bar .pct { font-variant-numeric: tabular-nums; }
.bar.mine { outline: 3.5px solid var(--you); outline-offset: 2px; }
.bar.mine .lbl::after { content: "YOU"; margin-left: 8px; font: 800 .65rem var(--body); letter-spacing: .08em; background: var(--you); color: #10233A; padding: 2px 6px; border-radius: 6px; vertical-align: 2px; }
.bar.other { border-style: dashed; }
.points { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.points b { font: 800 2.6rem/1 var(--display); color: var(--pink); font-variant-numeric: tabular-nums; }
.react { font: 800 1.2rem/1.2 var(--display); text-wrap: balance; }
.scale { position: relative; height: 56px; margin-top: 22px; border: 2px solid var(--line); border-radius: 10px; background: linear-gradient(90deg, var(--bar), var(--bar-top)); }
.pin { position: absolute; top: -26px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; font: 800 .75rem var(--body); white-space: nowrap; }
.pin i { width: 4px; height: 60px; background: var(--ink); border-radius: 2px; margin-top: 2px; }
.pin.you i { background: var(--you); }
.pin.you { color: var(--you); }
.note { font-size: .75rem; color: var(--muted); }

/* results */
.score { font: 800 clamp(3.4rem, 16vw, 4.6rem)/.9 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.score small { font-size: .35em; color: var(--muted); letter-spacing: 0; }
.title { font: 800 1.5rem/1.1 var(--display); }
.grid { font-size: 1.9rem; letter-spacing: .12em; }
.recap { display: flex; flex-direction: column; gap: 8px; }
.recap div { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-size: .92rem; }
.recap b { font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--ground); padding: 10px 18px; border-radius: 999px; font-weight: 800; z-index: 50; }
.copybox { width: 100%; box-sizing: border-box; min-height: 120px; border: 2px dashed var(--line); border-radius: 12px; padding: 10px; background: var(--ground); font: 600 .9rem var(--body); }

/* duel */
.duel { display: flex; flex-direction: column; gap: 10px; }
.duel .q { font-weight: 800; font-size: .9rem; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair span { border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; font-weight: 800; background: var(--ground); overflow-wrap: anywhere; }
.pair.jinx span { background: var(--sun); color: #1D1646; }
.jinx-tag { font: 800 .72rem var(--body); letter-spacing: .08em; color: var(--pink); }
.vs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 8px; }
.vs b { display: block; font: 800 2rem var(--display); font-variant-numeric: tabular-nums; }

/* archive */
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.day { border: 2px solid var(--line); border-radius: 12px; background: var(--card); padding: 10px 4px; font: 800 1rem var(--display); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.day small { font: 600 .7rem var(--body); color: var(--muted); }
.day.played { background: var(--sun); color: #1D1646; }
.day.played small { color: #1D1646; }

.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 13px; border-radius: 2px; animation: fall 1.7s ease-in forwards; }
@keyframes fall { to { transform: translate(var(--dx), 105vh) rotate(var(--r)); } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>

<div id="app"></div>

<script>
(() => {

/* ============================================================ */
const EPOCH = Date.UTC(2026, 8, 24);           // Samesies #1
const DAY = 864e5;
const dayNum = (t = Date.now()) => Math.max(1, Math.floor((t - EPOCH) / DAY) + 1);
const setFor = (d) => BANK[(d - 1) % BANK.length];
const $app = document.getElementById("app");
const KEY = "samesies.v1";

/* ---------- storage (per-viewer, safe) ---------- */
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {}
  return { v: 1, days: {}, name: "", streak: 0, best: 0, lastDaily: 0, challenge: null };
}
const S_ = load();
const liveStreak = () => (S_.lastDaily >= dayNum() - 1 ? S_.streak : 0);
function save() { try { localStorage.setItem(KEY, JSON.stringify(S_)); } catch (e) {} }

/* ---------- text matching ---------- */
function norm(s) {
  return String(s).toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "")
    .replace(/[’'`]/g, "").replace(/&/g, " and ").replace(/[^a-z0-9 ]+/g, " ")
    .replace(/\b(a|an|the|my|some|your)\b/g, " ").replace(/\s+/g, " ").trim();
}
const sing = (w) => (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) ? w.replace(/ies$/, "y").replace(/oes$/, "o").replace(/s$/, "") : w;
const keyOf = (s) => norm(s).split(" ").map(sing).join(" ");
function lev(a, b) {
  const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function matchAnswer(input, answers) {
  const k = keyOf(input); if (!k) return -1;
  const cands = answers.map((a) => [a.l, ...a.al].map(keyOf).filter(Boolean));
  for (let i = 0; i < cands.length; i++) if (cands[i].includes(k)) return i;
  for (let i = 0; i < cands.length; i++) if (cands[i].some((c) => c.length >= 4 && (" " + k + " ").includes(" " + c + " "))) return i;
  for (let i = 0; i < cands.length; i++) if (cands[i].some((c) => c.length >= 5 && lev(k, c) <= (c.length > 8 ? 2 : 1))) return i;
  return -1;
}

/* ---------- scoring ---------- */
function scoreFor(q, ans) {
  if (q.t === "pct") return Math.max(0, Math.round(100 - Math.abs(ans.g - q.v) * 2.5));
  if (ans.i < 0) return 0;
  const top = Math.max(...q.a.map((a) => a.p));
  return Math.round((q.a[ans.i].p / top) * 100);
}
const emojiFor = (pts) => pts >= 100 ? "🎯" : pts >= 60 ? "🟢" : pts >= 25 ? "🟡" : pts > 0 ? "🟠" : "🦄";
function reaction(pts, q) {
  if (q.t === "pct") {
    if (pts >= 95) return "Frighteningly accurate. Are you the crowd?";
    if (pts >= 75) return "Close! You read the room.";
    if (pts >= 40) return "In the neighbourhood. Wrong street.";
    return "The world disagrees with you. Loudly.";
  }
  if (pts >= 100) return pick(["SAMESIES! 🧠🧠 You and the world share one brain cell.", "Top answer. You are painfully normal and we love that.", "Survey says… YOU. Absolute hive mind."]);
  if (pts >= 60) return pick(["So close to the hive mind.", "Solid! The crowd nods politely.", "Big answer. Not THE answer."]);
  if (pts >= 25) return pick(["On the board! Respectable.", "Some of the world agrees with you.", "A niche but valid take."]);
  if (pts > 0) return pick(["Barely on the board 👀", "A tiny group of people back you up.", "You found the quiet corner of the crowd."]);
  return pick(["🦄 Unique. Nobody else is thinking what you're thinking.", "🦄 Main character energy. The crowd has no idea.", "🦄 Bold. Iconic. Completely alone."]);
}
function titleFor(total) {
  if (total >= 430) return "Human Wi-Fi 📶 — fully connected to everyone";
  if (total >= 340) return "Certified Normie 🐑 — in the best way";
  if (total >= 250) return "Crowd Whisperer 🌊";
  if (total >= 150) return "Slightly Off-Script 🎭";
  return "Main Character 🦄 — nobody thinks like you";
}
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

/* ---------- helpers ---------- */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast pop"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}
function confetti() {
  const box = document.createElement("div"); box.className = "confetti";
  const cols = ["#FF4F8B", "#16BFB3", "#FFD23F", "#7B61FF"];
  for (let i = 0; i < 44; i++) {
    const s = document.createElement("i");
    s.style.left = Math.random() * 100 + "%"; s.style.background = cols[i % 4];
    s.style.animationDelay = Math.random() * .3 + "s";
    s.style.setProperty("--dx", (Math.random() * 140 - 70) + "px");
    s.style.setProperty("--r", (Math.random() * 720) + "deg");
    box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2200);
}
async function copyText(text, fallbackHost) {
  try { await navigator.clipboard.writeText(text); toast("Copied! Paste it anywhere 📋"); return; } catch (e) {}
  // fallback: show a selectable box
  if (fallbackHost) {
    fallbackHost.innerHTML = `<p class="small muted">Copy this and paste it into WhatsApp, TikTok or anywhere:</p><textarea class="copybox" readonly>${esc(text)}</textarea>`;
    const ta = fallbackHost.querySelector("textarea"); ta.focus(); ta.select();
  }
}
function countdown(el) {
  const tick = () => {
    const next = EPOCH + dayNum() * DAY; let s = Math.max(0, Math.floor((next - Date.now()) / 1000));
    const h = Math.floor(s / 3600); s %= 3600; const m = Math.floor(s / 60); s %= 60;
    if (el.isConnected) el.textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  };
  tick(); const id = setInterval(() => { if (!el.isConnected) return clearInterval(id); tick(); }, 1000);
}
const LOGO = `<svg viewBox="0 0 60 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="#FF4F8B"/><circle cx="40" cy="20" r="16" fill="#16BFB3" style="mix-blend-mode:multiply"/></svg>`;
const VENN = `<svg class="venn" viewBox="0 0 150 96" aria-hidden="true"><circle cx="52" cy="48" r="42" fill="#FF4F8B"/><circle cx="98" cy="48" r="42" fill="#16BFB3" style="mix-blend-mode:multiply"/><text x="75" y="56" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="22" fill="#fff">=</text></svg>`;
function header() {

    <div class="chips"><span class="chip" title="Daily streak">🔥 ${liveStreak()}</span></div></header>`;
}
function bindNav() {
  $app.querySelectorAll("[data-go]").forEach((b) => b.addEventListener("click", () => {
    const g = b.dataset.go;
    if (g === "home") home(); else if (g === "archive") archive(); else if (g === "how") how();
  }));
}

/* ---------- challenge codes (no server needed) ---------- */
function b64enc(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj)); let bin = "";
  bytes.forEach((b) => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64dec(str) {
  const s = str.replace(/-/g, "+").replace(/_/g, "/"); const bin = atob(s + "===".slice((s.length + 3) % 4));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
}
function makeCode(d) {
  const rec = S_.days[d];
  const a = rec.ans.map((x) => x.t === "pct" ? x.g : (x.i >= 0 ? x.i : "~" + (x.x || "").slice(0, 24)));
  return "SAME-" + b64enc({ d, n: (S_.name || "A friend").slice(0, 16), a, p: rec.pts });
}
function readCode(raw) {
  const m = String(raw).trim().match(/SAME-([A-Za-z0-9_-]+)/) || String(raw).trim().match(/^c-([A-Za-z0-9_-]+)$/);
  if (!m) return null;
  try { const o = b64dec(m[1]); if (o && typeof o.d === "number" && Array.isArray(o.a) && o.a.length === 5) return o; } catch (e) {}
  return null;
}

function acceptChallenge(c) {
  S_.challenge = c; save();
  if (c.d > dayNum() || c.d < 1) return toast("That code is from the future 👽");
  const rec = S_.days[c.d];
  toast(`${c.n} challenged you! 🥊`);
  if (rec && rec.done) duel(c.d); else play(c.d);

function archive() {

/* ----- play loop ----- */
function play(d) {
  if (!S_.days[d]) S_.days[d] = { ans: [], pts: [], done: false, total: 0 };
  const rec = S_.days[d];
  if (rec.done) return results(d);
  question(d, rec.ans.length);
}

function progressBar(i) {
  return `<div class="progress" aria-label="Question ${i + 1} of 5">${[0, 1, 2, 3, 4].map((k) => `<i class="${k < i ? "done" : k === i ? "now" : ""}"></i>`).join("")}</div>`;
}

function question(d, i) {
  const q = setFor(d)[i];
  let body = "";
  if (q.t === "name") {
    body = `<form id="f" class="card" autocomplete="off">
      <input class="answer" id="ans" maxlength="40" placeholder="Type your answer…" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" aria-label="Your answer">
      <button class="btn" type="submit" id="lock" disabled>Lock it in</button>
      <p class="hint">Say what you think <i>most people</i> would say.</p></form>`;
  } else if (q.t === "pick") {
    const nums = q.a.every((a) => /^\d+$/.test(a.l));
    const opts = nums ? q.a.slice().sort((x, y) => +x.l - +y.l) : q.a;
    body = `<div class="options ${nums ? "nums" : ""}">${opts.map((a) => `<button class="opt" data-l="${esc(a.l)}">${esc(a.l)}</button>`).join("")}</div>
      <p class="hint">Pick what you think <i>most people</i> pick.</p>`;
  } else {
    body = `<form id="f" class="card slider"><output id="out">50%</output>
      <input type="range" id="rng" min="0" max="100" value="50" aria-label="Your percentage guess">
      <button class="btn" type="submit" style="width:100%">Lock it in</button></form>`;
  }
  $app.innerHTML = `${header()}${progressBar(i)}
    <span class="qtag">${esc(q.c)}</span>
    <p class="prompt">${esc(q.q)}</p>${body}`;
  bindNav();

  if (q.t === "name") {
    const inp = document.getElementById("ans"), lock = document.getElementById("lock");
    inp.addEventListener("input", () => lock.disabled = !norm(inp.value));
    document.getElementById("f").addEventListener("submit", (e) => {
      e.preventDefault(); const x = inp.value.trim(); if (!norm(x)) return;
      commit(d, i, { t: "name", x, i: matchAnswer(x, q.a) });
    });
    setTimeout(() => inp.focus(), 50);
  } else if (q.t === "pick") {
    $app.querySelectorAll(".opt").forEach((b) => b.onclick = () => {
      commit(d, i, { t: "pick", i: q.a.findIndex((a) => a.l === b.dataset.l) });
    });
  } else {
    const rng = document.getElementById("rng"), out = document.getElementById("out");
    rng.addEventListener("input", () => out.textContent = rng.value + "%");
    document.getElementById("f").addEventListener("submit", (e) => { e.preventDefault(); commit(d, i, { t: "pct", g: +rng.value }); });
  }
}

function commit(d, i, ans) {
  const rec = S_.days[d]; const q = setFor(d)[i];
  if (rec.ans.length !== i) return reveal(d, rec.ans.length - 1); // double tap guard
  rec.ans.push(ans); rec.pts.push(scoreFor(q, ans)); save();
  reveal(d, i);
}

function reveal(d, i) {
  const q = setFor(d)[i]; const rec = S_.days[d]; const ans = rec.ans[i]; const pts = rec.pts[i];
  let board = "";
  if (q.t === "pct") {
    board = `<div class="scale" role="img" aria-label="Crowd ${q.v} percent, you guessed ${ans.g} percent">
      <div class="pin" style="left:${q.v}%">Crowd ${q.v}%<i></i></div>
      <div class="pin you" style="left:${ans.g}%;top:auto;bottom:-26px;flex-direction:column-reverse"><span>You ${ans.g}%</span><i></i></div></div><div style="height:22px"></div>`;
  } else {
    const order = q.a.map((a, k) => ({ ...a, k })).sort((x, y) => y.p - x.p);
    const top = order[0].p; const other = Math.max(0, 100 - q.a.reduce((s, a) => s + a.p, 0));
    board = `<div class="board">${order.map((a) => `<div class="bar ${a.p === top ? "top" : ""} ${ans.i === a.k ? "mine" : ""}">
        <div class="fill" data-w="${a.p}"></div><span class="lbl">${esc(a.l)}</span><span class="pct">${a.p}%</span></div>`).join("")}
      ${other ? `<div class="bar other"><div class="fill" data-w="${other}"></div><span class="lbl">Everything else</span><span class="pct">${other}%</span></div>` : ""}
      ${ans.i < 0 ? `<div class="bar mine other"><span class="lbl">"${esc(ans.x)}" 🦄</span><span class="pct">—</span></div>` : ""}</div>`;
  }
  const last = i === 4;
  $app.innerHTML = `${header()}${progressBar(i + 1)}
    <span class="qtag">${esc(q.c)}</span>
    <p class="react">${esc(q.q)}</p>
    <section class="card pop">
      <div class="points"><span class="react">${esc(reaction(pts, q))}</span><b>+${pts}</b></div>
      ${board}
      <p class="note">Crowd = Samesies forecast (early access)</p>
    </section>
    <button class="btn" id="next">${last ? "See my results" : "Next question"}</button>`;
  bindNav();
  requestAnimationFrame(() => requestAnimationFrame(() => $app.querySelectorAll(".fill[data-w]").forEach((f) => f.style.width = f.dataset.w + "%")));
  if (pts >= 100) confetti();
  document.getElementById("next").onclick = () => last ? finish(d) : question(d, i + 1);
}

function finish(d) {
  const rec = S_.days[d];
  rec.done = true; rec.total = rec.pts.reduce((s, p) => s + p, 0);
  S_.best = Math.max(S_.best, rec.total);
  const today = dayNum();
  if (d === today && S_.lastDaily !== today) {
    S_.streak = S_.lastDaily === today - 1 ? S_.streak + 1 : 1;
    S_.lastDaily = today;
  }
  save();
  if (S_.challenge && S_.challenge.d === d) return duel(d);
  results(d);
}

function shareText(d) {
  const rec = S_.days[d];
  return `Samesies #${d} 🧠 ${rec.total}/500\n${rec.pts.map(emojiFor).join("")}\n${titleFor(rec.total)}\nCan you think like the world?`;
}

function results(d) {
  const rec = S_.days[d]; const qs = setFor(d);
  $app.innerHTML = `${header()}
  <section class="card pop">
    <p class="eyebrow">Samesies #${d}</p>
    <div class="score">${rec.total}<small> / 500</small></div>
    <p class="title">${esc(titleFor(rec.total))}</p>
    <div class="grid" aria-label="Your five results">${rec.pts.map(emojiFor).join("")}</div>
    <div class="row"><button class="btn" id="share">Share my score</button></div>
    <div id="shareHost"></div>
  </section>
  <section class="card">
    <p class="eyebrow">Challenge a friend 🥊</p>
    <p class="muted small">Send your code. They play the same 5 questions, then you both see where you <b>JINX!</b>ed.</p>
    <form class="field" id="nameForm"><input id="nm" maxlength="16" placeholder="Your name" value="${esc(S_.name)}" aria-label="Your name for challenges"><button class="btn aqua" type="submit">Get code</button></form>
    <div id="codeHost"></div>
  </section>
  <section class="card">
    <p class="eyebrow">Your answers</p>
    <div class="recap">${qs.map((q, k) => {
      const a = rec.ans[k]; const shown = a.t === "pct" ? a.g + "%" : a.i >= 0 ? q.a[a.i].l : `"${a.x}"`;
      return `<div><span>${emojiFor(rec.pts[k])}</span><span>${esc(shown)}</span><b>+${rec.pts[k]}</b></div>`;
    }).join("")}</div>
  </section>
  <p class="muted small">Next Samesies in <span class="count" id="cd"></span></p>
  <div class="row"><button class="btn alt" data-go="archive">Play past days</button><button class="btn alt" data-go="home">Home</button></div>`;
  bindNav(); countdown(document.getElementById("cd"));
  document.getElementById("share").onclick = () => copyText(shareText(d), document.getElementById("shareHost"));
  document.getElementById("nameForm").addEventListener("submit", (e) => {
    e.preventDefault();
    S_.name = document.getElementById("nm").value.trim().slice(0, 16) || "A friend"; save();
    const code = makeCode(d);
    const text = `${S_.name} challenged you on Samesies #${d} 🥊\nMy score: ${rec.total}/500 ${rec.pts.map(emojiFor).join("")}\nPaste this code in the game to play the same questions:\n${code}`;
    const host = document.getElementById("codeHost");
    host.innerHTML = `<textarea class="copybox" readonly aria-label="Your challenge message">${esc(text)}</textarea><button class="btn" id="copyCode" style="width:100%">Copy challenge</button>`;
    document.getElementById("copyCode").onclick = () => copyText(text, host);
  });
}

function duel(d) {
  const c = S_.challenge; const rec = S_.days[d]; const qs = setFor(d);
  const theirs = (q, v) => q.t === "pct" ? v + "%" : typeof v === "number" ? (q.a[v] ? q.a[v].l : "?") : `"${String(v).slice(1)}"`;
  const mine = (q, a) => a.t === "pct" ? a.g + "%" : a.i >= 0 ? q.a[a.i].l : `"${a.x}"`;
  let jinx = 0;
  const rows = qs.map((q, k) => {
    const v = c.a[k], a = rec.ans[k];
    const same = q.t === "pct" ? Math.abs(v - a.g) <= 3
      : typeof v === "number" ? v === a.i : (a.i < 0 && keyOf(String(v).slice(1)) === keyOf(a.x || ""));
    if (same) jinx++;
    return `<div><p class="q">${esc(q.q)}</p><div class="pair ${same ? "jinx" : ""}"><span>${esc(mine(q, a))}</span><span>${esc(theirs(q, v))}</span></div>${same ? `<p class="jinx-tag">JINX! 🤞</p>` : ""}</div>`;
  }).join("");
  const theirTotal = (c.p || []).reduce((s, p) => s + p, 0);
  const verdict = jinx >= 4 ? "You two share ONE brain cell. Scientists are concerned. 🧠" : jinx >= 2 ? "Solid overlap. You'd survive a road trip together. 🚗" : jinx === 1 ? "One jinx. A fragile but real connection. 🤝" : "Zero jinxes. Are you even from the same planet? 👽";
  $app.innerHTML = `${header()}
  <p class="eyebrow">Samesies #${d} · Challenge</p>
  <section class="card pop">
    <div class="vs"><div><b>${rec.total}</b><span class="small muted">You</span></div><h2>vs</h2><div><b>${theirTotal}</b><span class="small muted">${esc(c.n)}</span></div></div>
    <p class="title" style="text-align:center">${jinx} JINX${jinx === 1 ? "" : "ES"}!</p>
    <p class="muted" style="text-align:center">${verdict}</p>
  </section>
  <section class="card duel">
    <div class="pair"><span class="small" style="border:0;background:none;padding:0">You</span><span class="small" style="border:0;background:none;padding:0">${esc(c.n)}</span></div>
    ${rows}
  </section>
  <div class="row"><button class="btn" id="res">My results</button><button class="btn alt" data-go="home">Home</button></div>`;
  bindNav();
  if (jinx >= 3) confetti();
  document.getElementById("res").onclick = () => { S_.challenge = null; save(); results(d); };
}

/* ---------- boot ---------- */
const hash = (location.hash || "").slice(1);
const fromHash = hash ? readCode(hash) : null;
if (fromHash) acceptChallenge(fromHash); else home();
})();
</script>
