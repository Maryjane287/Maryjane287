<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const W = 800, H = 600, TAU = Math.PI * 2;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const loader = new GLTFLoader();
const cache = {};
const P = {
  pets: 'cube-pets/Models/GLB format/', chars: 'mini-characters/Models/GLB format/', arena: 'mini-arena/Models/GLB format/',
  food: 'food-kit/Models/GLB format/', nature: 'nature-kit/Models/GLTF format/', space: 'space-kit/Models/GLTF format/', pirate: 'pirate-kit/Models/GLB format/'
};
async function M(pack, name, scale = 1) {
  const url = P[pack] + name + '.glb';
  if (!cache[url]) cache[url] = await loader.loadAsync(url);
  const o = cache[url].scene.clone(true);
  o.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
  o.scale.setScalar(scale);
  return o;
}
async function Mh(pack, name, h) {
  const o = await M(pack, name, 1);
  const sz = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3());
  o.scale.setScalar(h / Math.max(sz.y, .001));
  return o;
}
function gradientBg(top, bottom) {
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom); g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const mat = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .8, ...o });
function box(w, h, d, c, x, y, z, parent) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; }

function island(scene, top, side = '#8a5a3c', r = 5) {
  const g = new THREE.Group();
  const t = new THREE.Mesh(new THREE.CylinderGeometry(r, r * .96, .7, 48), mat(top)); t.position.y = -.35; t.receiveShadow = true; g.add(t);
  const s = new THREE.Mesh(new THREE.CylinderGeometry(r * .96, r * .85, .9, 48), mat(side)); s.position.y = -1.1; g.add(s);
  const u = new THREE.Mesh(new THREE.ConeGeometry(r * .85, r * 1.1, 9), mat(side, { flatShading: true })); u.position.y = -1.55 - r * .55; u.rotation.x = Math.PI; g.add(u);
  for (let i = 0; i < 4; i++) { const k = new THREE.Mesh(new THREE.DodecahedronGeometry(rand(.3, .6)), mat(side, { flatShading: true })); const a = rand(0, TAU); k.position.set(Math.cos(a) * r * 1.15, -rand(1.5, 3.5), Math.sin(a) * r * 1.15); g.add(k); }
  scene.add(g); return g;
}
function rand(a, b) { return a + Math.random() * (b - a); }
function clouds(scene, n = 5, color = '#ffffff') {
  for (let i = 0; i < n; i++) {
    const c = new THREE.Group(); const m = mat(color, { roughness: 1 });
    for (let k = 0; k < 4; k++) { const s = new THREE.Mesh(new THREE.SphereGeometry(rand(.6, 1.1), 16, 12), m); s.position.set(k * .9 - 1.3, rand(-.2, .3), rand(-.3, .3)); c.add(s); }
    c.position.set((i % 2 ? 1 : -1) * rand(6, 11), rand(2, 5.5), -rand(6, 10)); scene.add(c);
  }
}
function setup(bgTop, bgBottom, sunColor = '#fff3d6', dark = false) {
  const scene = new THREE.Scene();
  scene.background = gradientBg(bgTop, bgBottom);
  scene.add(new THREE.HemisphereLight(dark ? '#a9b8ff' : '#e6f7ff', dark ? '#30304a' : '#9fd88a', dark ? 1.1 : 1.5));
  const s = new THREE.DirectionalLight(sunColor, dark ? 2.4 : 2.4); s.position.set(6, 12, 8); s.castShadow = true;
  s.shadow.mapSize.set(2048, 2048); Object.assign(s.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); s.shadow.bias = -.0005;
  scene.add(s);
  const cam = new THREE.PerspectiveCamera(34, W / H, .1, 100); cam.position.set(0, 9.5, 14.5); cam.lookAt(0, .6, 0);
  return { scene, cam };
}
function ring(n, r, fn) { for (let i = 0; i < n; i++) fn(i / n * TAU, Math.cos(i / n * TAU) * r, Math.sin(i / n * TAU) * r); }
function place(o, x, z, ry = 0, y = 0) { o.position.set(x, y, z); o.rotation.y = ry; return o; }
function rainbow(scene, x, z, r = 2.4) {
  ['#ff4f4f', '#ff9f1c', '#ffd23f', '#3ee0a1', '#36c2f5', '#8b5cf6'].forEach((c, i) => {
    const t = new THREE.Mesh(new THREE.TorusGeometry(r - i * .22, .11, 8, 40, Math.PI), mat(c, { emissive: c, emissiveIntensity: .25 }));
    t.position.set(x, 0, z); t.castShadow = true; scene.add(t);
  });
}
function blockDino(color, belly) {
  const d = new THREE.Group();
  box(1.6, 1.1, 1.0, color, 0, 1.2, 0, d);              // body
  box(1.0, .8, .9, belly, 0, .95, .12, d).scale.set(.9, .8, 1);
  box(.55, 1.0, .55, color, .75, 1.95, 0, d);           // neck
  box(.95, .65, .7, color, 1.15, 2.55, 0, d);           // head
  box(.5, .2, .55, belly, 1.4, 2.3, 0, d);              // jaw
  for (const z of [-.36, .36]) { box(.18, .2, .05, '#ffffff', 1.3, 2.7, z, d); box(.09, .12, .03, '#2a1f4d', 1.36, 2.69, z * 1.06, d); }
  box(.9, .6, .6, color, -1.15, 1.25, 0, d); box(.7, .4, .4, color, -1.85, 1.1, 0, d); box(.5, .25, .25, color, -2.4, 1.0, 0, d);
  for (const [x, z] of [[.5, .35], [.5, -.35], [-.5, .35], [-.5, -.35]]) box(.38, .75, .38, color, x, .38, z, d);
  for (let i = 0; i < 4; i++) { const s = new THREE.Mesh(new THREE.ConeGeometry(.18, .4, 4), mat('#ff8a3d')); s.position.set(.5 - i * .45, 1.95, 0); s.castShadow = true; d.add(s); }
  return d;
}
function eiffel() {
  const g = new THREE.Group(), c = '#c27c3e', dk = '#8e5527';
  for (const [x, z] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) { const leg = box(.32, 2.6, .32, c, x * .75, 1.2, z * .75, g); leg.rotation.set(z * .28, 0, -x * .28); }
  box(2.2, .22, 2.2, dk, 0, 2.4, 0, g);
  for (const [x, z] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) { const leg = box(.24, 2.2, .24, c, x * .38, 3.5, z * .38, g); leg.rotation.set(z * .14, 0, -x * .14); }
  box(1.1, .18, 1.1, dk, 0, 4.6, 0, g);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(.08, .32, 2.6, 4), mat(c)); top.position.y = 5.95; top.rotation.y = Math.PI / 4; top.castShadow = true; g.add(top);
  const arch = new THREE.Mesh(new THREE.TorusGeometry(.62, .12, 6, 20, Math.PI), mat(dk)); arch.position.set(0, .9, .95); g.add(arch);
  const arch2 = arch.clone(); arch2.position.z = -.95; g.add(arch2);
  const flag = box(.5, .3, .02, '#ff4f9a', .28, 7.2, 0, g);
  return g;
}

const SCENES = {
  async park() {
    const { scene, cam } = setup('#7fd3ff', '#d9f4ff'); island(scene, '#7ed957'); clouds(scene);
    rainbow(scene, 0, -1.6, 2.6);
    const tr = await M('arena', 'trophy', 2.4); scene.add(place(tr, 0, -1.6, .3));
    for (const [n, x, z, s] of [['tree_oak', -3.6, -1.2, 2.4], ['tree_default', 3.6, -1.6, 2.6], ['tree_fat', -2.8, 2.2, 2], ['tree_detailed', 3.2, 2, 2]]) scene.add(place(await M('nature', n, s), x, z, rand(0, 6)));
    for (let i = 0; i < 14; i++) { const n = ['flower_redA', 'flower_yellowA', 'flower_purpleA'][i % 3]; const a = rand(0, TAU), r = rand(1.5, 4.4); scene.add(place(await Mh('nature', n, .7), Math.cos(a) * r, Math.sin(a) * r + 1, rand(0, 6))); }
    scene.add(place(await M('pets', 'animal-bunny', 1.1), -1.2, 1.6, .5));
    scene.add(place(await M('pets', 'animal-panda', 1.1), 1.4, 1.4, -.5));
    scene.add(place(await M('chars', 'character-female-a', 1.4), 0, 2.6, 0));
    return { scene, cam };
  },
  async zoo() {
    const { scene, cam } = setup('#8fe0ff', '#fff6d6'); island(scene, '#8fdc5d'); clouds(scene);
    ring(16, 4.4, async () => {});
    for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; if (Math.sin(a) > .7) continue; scene.add(place(await M('nature', 'fence_simple', 2.2), Math.cos(a) * 4.3, Math.sin(a) * 4.3, -a + Math.PI / 2)); }
    for (const [n, x, z, s, r] of [['animal-giraffe', -2.3, -1.8, 1.5, .5], ['animal-elephant', 2.2, -1.7, 1.5, -.5], ['animal-lion', 0, 1.3, 1.5, 0], ['animal-monkey', -2.7, 1.5, 1.2, .6], ['animal-tiger', 2.7, 1.5, 1.2, -.6]]) scene.add(place(await M('pets', n, s), x, z, r));
    for (const [n, x, z] of [['tree_palmTall', -3.6, -2.4], ['tree_fat', 3.7, -2.2], ['plant_bushLarge', -.4, -3]]) scene.add(place(await M('nature', n, 2.6), x, z, rand(0, 6)));
    return { scene, cam };
  },
  async pizza() {
    const { scene, cam } = setup('#ffb3d9', '#fff1c9'); island(scene, '#ffd23f', '#d9822b'); clouds(scene, 5, '#fff7fb');
    scene.add(place(await M('food', 'pizza', 6.5), 0, -1, .3, .02));
    for (const [n, x, z, s] of [['burger-cheese-double', -3, -.6, 5], ['fries', 3, -.8, 5.5], ['ice-cream', -2.6, 2.1, 5], ['donut-sprinkles', 2.4, 2.2, 5], ['cupcake', .2, 2.8, 4.5], ['soda', 3.7, 1, 4.5], ['lollypop', -3.9, 1.2, 5], ['lollypop', 0, -3.6, 5]]) scene.add(place(await M('food', n, s), x, z, rand(-.6, .6)));
    return { scene, cam };
  },
  async beach() {
    const { scene, cam } = setup('#5fcfff', '#e6fbff'); island(scene, '#ffe08a', '#d9a35b'); clouds(scene);
    const lagoon = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 1.8, .1, 32), mat('#36c2f5', { roughness: .2 })); lagoon.position.set(1.4, .01, -.6); scene.add(lagoon);
    scene.add(place(await Mh('pirate', 'ship-pirate-small', 2.6), 1.4, -.6, -.6, .02));
    for (const [n, x, z, s] of [['palm-detailed-bend', -3, -1.4, 3.4], ['palm-straight', -3.6, 1.2, 3.2], ['palm-bend', 3.8, 1.8, 3]]) scene.add(place(await Mh('pirate', n, s), x, z, rand(0, 6)));
    scene.add(place(await Mh('pirate', 'chest', .9), -1.2, 2, .4));
    scene.add(place(await M('pets', 'animal-crab', 1.2), .6, 2.6, -.3));
    for (const [n, x, z] of [['rocks-sand-a', 3, -2.8], ['rocks-sand-b', -1.8, -2.8]]) scene.add(place(await Mh('pirate', n, .6), x, z));
    return { scene, cam };
  },
  async paris() {
    const { scene, cam } = setup('#8ad0ff', '#ffe4f1'); island(scene, '#86d65c'); clouds(scene);
    const e = eiffel(); e.scale.setScalar(.95); scene.add(place(e, 0, -1.2, .4));
    for (const [n, x, z, s] of [['croissant', -2.8, 1.6, 6], ['loaf-baguette', 2.6, 1.6, 5], ['cup-coffee', 3.4, -.6, 5]]) scene.add(place(await M('food', n, s), x, z, rand(-.5, .5)));
    for (const [n, x, z] of [['tree_plateau', -3.5, -1.6], ['tree_plateau', 3.4, -2.6], ['tree_simple', -2.5, -3.2]]) scene.add(place(await M('nature', n, 2.4), x, z));
    for (let i = 0; i < 10; i++) { const a = rand(0, TAU), r = rand(2, 4.3); scene.add(place(await Mh('nature', ['flower_redA', 'flower_purpleA'][i % 2], .7), Math.cos(a) * r, Math.sin(a) * r + 1)); }
    scene.add(place(await M('pets', 'animal-cat', 1.1), 0, 2.6, 0));
    return { scene, cam };
  },
  async egypt() {
    const { scene, cam } = setup('#ffc46b', '#fff3cf', '#ffe0a8'); island(scene, '#f6cf72', '#c9893f'); clouds(scene, 3, '#fff9ec');
    for (const [x, z, s] of [[-.6, -1.6, 2.4], [2.4, -.8, 1.7], [-3, .2, 1.3]]) {
      const p = new THREE.Mesh(new THREE.ConeGeometry(s * 1.15, s * 1.6, 4), mat('#e9b85a', { flatShading: true })); p.position.set(x, s * .8, z); p.rotation.y = Math.PI / 4; p.castShadow = true; scene.add(p);
      const cap = new THREE.Mesh(new THREE.ConeGeometry(s * .22, s * .3, 4), mat('#ffd23f', { emissive: '#ffb000', emissiveIntensity: .4 })); cap.position.set(x, s * 1.47, z); cap.rotation.y = Math.PI / 4; scene.add(cap);
    }
    const sphinx = await M('pets', 'animal-cat', 1.5); scene.add(place(sphinx, .9, 2.2, -.3));
    for (const [n, x, z] of [['palm-detailed-straight', -3.8, 2], ['palm-bend', 3.8, 1.6]]) scene.add(place(await Mh('pirate', n, 3), x, z));
    scene.add(place(await Mh('pirate', 'rocks-sand-c', .6), -1.8, 2.6));
    return { scene, cam };
  },
  async dino() {
    const { scene, cam } = setup('#9be7a8', '#f2ffe1'); island(scene, '#5cc94a', '#7a4a2e'); clouds(scene);
    const vol = new THREE.Mesh(new THREE.CylinderGeometry(.7, 2.2, 3, 10), mat('#8b5a3c', { flatShading: true })); vol.position.set(-2.4, 1.5, -2.2); vol.castShadow = true; scene.add(vol);
    const lava = new THREE.Mesh(new THREE.CylinderGeometry(.62, .62, .1, 10), mat('#ff6a00', { emissive: '#ff4500', emissiveIntensity: 1.2 })); lava.position.set(-2.4, 3.02, -2.2); scene.add(lava);
    for (let i = 0; i < 4; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(.3 + i * .12, 10, 8), mat('#d9d4cf', { roughness: 1 })); s.position.set(-2.4 + i * .2, 3.4 + i * .45, -2.2 - i * .1); scene.add(s); }
    const d1 = blockDino('#3ee0a1', '#d9ffe9'); d1.scale.setScalar(.95); scene.add(place(d1, .8, .2, -.5));
    const d2 = blockDino('#ff8a3d', '#ffe2c9'); d2.scale.setScalar(.6); scene.add(place(d2, -1.6, 2, .7));
    for (const [n, x, z, s] of [['tree_palmDetailedTall', 3.6, -1.8, 2.6], ['tree_palmTall', 3.4, 1.8, 2.4], ['mushroom_redGroup', -.2, 3, 2.4], ['plant_bushLarge', 1.4, -3, 2.4], ['rock_largeA', -3.8, .8, 1.6]]) scene.add(place(await M('nature', n, s), x, z, rand(0, 6)));
    return { scene, cam };
  },
  async moon() {
    const { scene, cam } = setup('#120f3a', '#3b2b7a', '#e8ecff', true); island(scene, '#c9c6dd', '#77738f');
    for (let i = 0; i < 160; i++) { const s = new THREE.Mesh(new THREE.SphereGeometry(rand(.02, .06), 6, 4), new THREE.MeshBasicMaterial({ color: '#ffffff' })); s.position.set(rand(-22, 22), rand(-6, 14), rand(-20, -8)); scene.add(s); }
    const earth = new THREE.Mesh(new THREE.SphereGeometry(1.4, 32, 24), mat('#36a2f5', { emissive: '#1e5aa8', emissiveIntensity: .35 })); earth.position.set(5.5, 6.5, -9); scene.add(earth);
    for (let i = 0; i < 5; i++) { const l = new THREE.Mesh(new THREE.SphereGeometry(rand(.4, .6), 12, 8), mat('#3ee0a1')); const a = rand(0, TAU), b = rand(-1, 1); l.position.set(5.5 + Math.cos(a) * 1.15, 6.5 + b * .9, -9 + Math.sin(a) * .6 + .8); l.scale.z = .4; scene.add(l); }
    const rk = new THREE.Group(); let y = 0;
    for (const n of ['rocket_baseA', 'rocket_fuelA', 'rocket_fuelA', 'rocket_topA']) { const o = await M('space', n, 1); o.position.y = y; rk.add(o); y = new THREE.Box3().setFromObject(o).max.y; }
    rk.add(await M('space', 'rocket_finsA', 1));
    const rsz = new THREE.Box3().setFromObject(rk).getSize(new THREE.Vector3()); rk.scale.setScalar(4.6 / rsz.y); rk.position.set(-1.4, 0, -1.4); scene.add(rk);
    for (const [n, x, z, s, r] of [['rover', 2.2, .8, .9, -.7], ['astronautA', .4, 1.8, 1.3, .3], ['satelliteDish_detailed', 3, -2, 1.8, -.8], ['craterLarge', -2.6, 2, .25, 0], ['crater', 1.6, -2.8, .25, 0], ['rock_crystalsLargeA', -3.6, -.4, 1.2, 0], ['alien', -.9, 2.8, 1.1, .2]]) scene.add(place(await Mh('space', n, s), x, z, r));
    return { scene, cam };
  }
};
window.renderPlace = async name => {
  const { scene, cam } = await SCENES[name]();
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
};
window.ready = true;
</script>
